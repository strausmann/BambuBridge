[alembic]
script_location = %(here)s/app/migrations
# Developer CLI only (uv run alembic ...); the container builds its config in code,
# see app/migrations/__init__.py. 2026_11_12_0001_baseline.py: date, revision id, slug.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# No sqlalchemy.url here: env.py takes it from the caller (tests) or from the
# BAMBUBRIDGE_DATABASE_URL startup setting.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
