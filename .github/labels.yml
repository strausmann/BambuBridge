# Label taxonomy — synced to GitHub by .github/workflows/labels.yml (do NOT create labels in the UI; they get removed on sync).
# Aligned with strausmann/Label-Printer-Hub (colours and descriptions of shared labels are identical); BambuBridge-specific
# area:* and hardware:* labels follow the LPH colour palette. Schema: https://github.com/EndBug/label-sync#config-files

# ============================================================================
# type — what kind of work is this?
# ============================================================================
- name: "type:bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type:feature"
  color: "a2eeef"
  description: "New feature or enhancement"

- name: "type:enhancement"
  color: "1d76db"
  description: "Improvement to existing behaviour"

- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"

- name: "type:refactor"
  color: "fef2c0"
  description: "Code change without behaviour change"

- name: "type:test"
  color: "fbca04"
  description: "Test additions or fixes"

- name: "type:chore"
  color: "cccccc"
  description: "Tooling, deps, CI, housekeeping"

- name: "type:security"
  color: "b60205"
  description: "Security-relevant"

- name: "type:question"
  color: "d876e3"
  description: "Question or discussion"

# ============================================================================
# area — where in the code (mirrors .github/SCOPES.md)
# ============================================================================
- name: "area:ams"
  color: "fbca04"
  description: "AMS / slot logic"

- name: "area:api"
  color: "0052cc"
  description: "FastAPI endpoints / auth"

- name: "area:ci"
  color: "ededed"
  description: "GitHub Actions, releases, build pipeline"

- name: "area:cloud"
  color: "ffc107"
  description: "Bambu Cloud import"

- name: "area:consumption"
  color: "f9d0c4"
  description: "Consumption / reconcile"

- name: "area:db"
  color: "5319e7"
  description: "SQLite model / migrations"

- name: "area:docker"
  color: "2496ed"
  description: "Docker / compose"

- name: "area:docs"
  color: "0075ca"
  description: "Documentation"

- name: "area:esp32"
  color: "0e8a16"
  description: "ESP32 slot selector"

- name: "area:mqtt"
  color: "1d76db"
  description: "LAN/Cloud MQTT ingest"

- name: "area:presets"
  color: "8a2be2"
  description: "Bambu preset generation"

- name: "area:security"
  color: "ee0701"
  description: "Security-relevant changes"

- name: "area:spoolman"
  color: "bfd4f2"
  description: "Spoolman sync / SpoolmanDB"

- name: "area:tags"
  color: "f0a3ff"
  description: "RFID tag lifecycle"

- name: "area:ui"
  color: "c5def5"
  description: "PWA / web frontend"

# ============================================================================
# status — lifecycle
# ============================================================================
- name: "status:blocked"
  color: "b60205"
  description: "Blocked on external dependency or decision"

- name: "status:duplicate"
  color: "cccccc"
  description: "Duplicate of another issue/PR"

- name: "status:in-progress"
  color: "0e8a16"
  description: "Someone is actively working on this"

- name: "status:needs-info"
  color: "fbca04"
  description: "Waiting for more information from reporter"

- name: "status:needs-triage"
  color: "ededed"
  description: "Awaiting maintainer triage"
  aliases: ['status:triage']

- name: "status:ready-for-review"
  color: "0e8a16"
  description: "Ready for review"

- name: "status:wontfix"
  color: "ffffff"
  description: "Decided not to address"

# ============================================================================
# priority
# ============================================================================
- name: "priority:critical"
  color: "b60205"
  description: "Drop everything"

- name: "priority:high"
  color: "d93f0b"
  description: "Address soon"

- name: "priority:medium"
  color: "fbca04"
  description: "Normal priority"

- name: "priority:low"
  color: "0e8a16"
  description: "Nice to have"

- name: "priority:backlog"
  color: "c5def5"
  description: "Backlog — kein aktiver Handlungsbedarf"

# ============================================================================
# hardware
# ============================================================================
- name: "hardware:ams"
  color: "8a2be2"
  description: "AMS hardware"

- name: "hardware:bambu"
  color: "8a2be2"
  description: "Bambu printer / firmware behaviour"

- name: "hardware:esp32"
  color: "8a2be2"
  description: "ESP32-2432S028 (CYD)"

# ============================================================================
# meta and Dependabot ecosystems
# ============================================================================
- name: "breaking-change"
  color: "b60205"
  description: "Major version bump required"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "docker"
  color: "2496ed"
  description: "Docker image dependencies"

- name: "github-actions"
  color: "2088ff"
  description: "GitHub Actions workflow dependencies"

- name: "good-first-issue"
  color: "7057ff"
  description: "Good for new contributors"

- name: "help-wanted"
  color: "008672"
  description: "Extra attention needed"

- name: "javascript"
  color: "f1e05a"
  description: "JavaScript/Node dependencies"

- name: "python"
  color: "3572a5"
  description: "Python dependencies"

- name: "release-note"
  color: "0e8a16"
  description: "Mention in release notes"

- name: "superpowers:brainstorming"
  color: "8a2be2"
  description: "Konzept wurde mit superpowers:brainstorming geplant"

