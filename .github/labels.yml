# Label taxonomy — synced to GitHub (do NOT create labels in the UI; they get removed on sync).
# type:* (what), area:* (where), status:* (lifecycle), priority:*, plus meta + hardware.

# --- type ---
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability"
- name: "type:enhancement"
  color: "1d76db"
  description: "Improvement to existing behaviour"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation / guidelines / ADRs"
- name: "type:refactor"
  color: "5319e7"
  description: "Code change without behaviour change"
- name: "type:test"
  color: "bfd4f2"
  description: "Tests"
- name: "type:chore"
  color: "fef2c0"
  description: "Tooling / maintenance"
- name: "type:security"
  color: "b60205"
  description: "Security-relevant"
- name: "type:question"
  color: "cc317c"
  description: "Question / discussion"

