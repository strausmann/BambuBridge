name: Docker - publish

# Two phases, no QEMU:
#   build: one job per platform on a NATIVE runner (amd64 and arm64). Each pushes its image BY
#          DIGEST (no tag) with provenance and an SBOM attestation, and uploads the digest.
#   merge: assembles the multi-arch index, applies the tags, checks both architectures and signs
#          the index digest with the project key (cosign, COSIGN_PRIVATE_KEY).
#
# Registries: GHCR always. Docker Hub only when the repository is public AND the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set. Docker Hub receives exactly the tags GHCR gets.
#
# Tags: release X.Y.Z, X.Y and latest (a pre-release such as 0.2.0-rc.1 gets its exact tag only);
# a push to main gets edge and sha-<7>.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/brand/**"
      - "licence-policy.yml"
      - ".github/workflows/docker-publish.yml"
  # Called by release.yml once semantic-release has published a version: a release created with
  # GITHUB_TOKEN never fires `release: published`.
  workflow_call:
    inputs:
      tag:
        description: "Release version to build, e.g. 0.2.0 (a leading v is accepted)."
        type: string
        required: true
    secrets:
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version to build, e.g. 0.2.0. Leave empty to build edge from the selected branch."
        required: false

permissions:
  contents: read
  packages: write

# A release build is never cancelled: a half-published release leaves the registry inconsistent.
concurrency:
  group: docker-publish-${{ inputs.tag && format('release-{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !inputs.tag }}

env:
  # Written out, not derived from github.repository.
  GHCR_IMAGE: ghcr.io/strausmann/bambubridge
  DOCKERHUB_IMAGE: docker.io/strausmann/bambubridge
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # A manual run without a tag from another branch must not move edge or sha-<7>: only main, or a
    # release (tag set), publishes.
    if: github.ref == 'refs/heads/main' || inputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Validate release tag input
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          semver='^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [ -n "$INPUT_TAG" ] && ! [[ "$INPUT_TAG" =~ $semver ]]; then
            echo "::error::Invalid release tag input: not a semantic version"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release builds the tag's commit, never the caller's. Empty = the event's ref.
          ref: ${{ inputs.tag && (startsWith(inputs.tag, 'v') && format('refs/tags/{0}', inputs.tag) || format('refs/tags/v{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - name: Resolve revision and version
        id: rev
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `secrets.*` is not allowed in step-level `if:`; the value goes through env first.
      - name: Decide on Docker Hub
        id: hub
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$VISIBILITY" = "public" ] && [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.title=BambuBridge
            org.opencontainers.image.description=BambuBridge - a self-hosted bridge between Bambu Lab printers and your workshop tools. Not a product of Bambu Lab.
            org.opencontainers.image.source=https://github.com/strausmann/BambuBridge
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}${{ steps.hub.outputs.enabled == 'true' && format(',{0}', env.DOCKERHUB_IMAGE) || '' }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.rev.outputs.version || 'edge' }}
            REVISION=${{ steps.rev.outputs.sha }}
            BUILD_DATE=${{ steps.rev.outputs.date }}
          cache-from: type=gha,scope=bambubridge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bambubridge-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest and sign
    # A manual run without a tag from another branch must not move edge or sha-<7>: only main, or a
    # release (tag set), publishes.
    if: github.ref == 'refs/heads/main' || inputs.tag != ''
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cosign.pub is read from the commit that is built.
          ref: ${{ inputs.tag && (startsWith(inputs.tag, 'v') && format('refs/tags/{0}', inputs.tag) || format('refs/tags/v{0}', inputs.tag)) || '' }}
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide on Docker Hub
        id: hub
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$VISIBILITY" = "public" ] && [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Classify the build
        id: kind
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "$INPUT_TAG" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.hub.outputs.enabled == 'true' && env.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=raw,value=edge,enable=${{ steps.kind.outputs.release != 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.kind.outputs.release != 'true' }}
            type=semver,pattern={{version}},value=${{ steps.kind.outputs.version }},enable=${{ steps.kind.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.kind.outputs.version }},enable=${{ steps.kind.outputs.release == 'true' && !contains(steps.kind.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ steps.kind.outputs.release == 'true' && !contains(steps.kind.outputs.version, '-') }}
          annotations: |
            org.opencontainers.image.title=BambuBridge
            org.opencontainers.image.description=BambuBridge - a self-hosted bridge between Bambu Lab printers and your workshop tools. Not a product of Bambu Lab.
            org.opencontainers.image.source=https://github.com/strausmann/BambuBridge
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args+=( -t "$tag" )
          done <<< "$TAGS"
          ann_args=()
          while IFS= read -r ann; do
            case "$ann" in index:*) ann_args+=( --annotation "$ann" ) ;; esac
          done <<< "$ANNOTATIONS"
          src_args=()
          for d in *; do
            src_args+=( "${GHCR_IMAGE}@sha256:${d}" )
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index-meta.json" \
            "${tag_args[@]}" "${ann_args[@]}" "${src_args[@]}"

      - name: Verify the multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            archs=$(docker buildx imagetools inspect "$tag" --raw \
              | jq -r '.manifests[].platform | select(. != null) | "\(.os)/\(.architecture)"' | sort -u)
            echo "$tag: $(echo "$archs" | tr '\n' ' ')"
            for want in linux/amd64 linux/arm64; do
              echo "$archs" | grep -qx "$want" || { echo "::error::Missing $want in $tag"; fail=1; }
            done
          done <<< "$TAGS"
          exit "$fail"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Signed is the index digest (read from the imagetools metadata, never a movable tag), once per
      # repository the index was pushed to. The signature is verified with the committed cosign.pub
      # right away, so a wrong key or password fails this run instead of the first user.
      - name: Sign the index by digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          DIGEST=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index-meta.json")
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No valid index digest in the imagetools metadata file"
            exit 1
          fi
          repos=()
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            repo="${ref%:*}"
            case " ${repos[*]-} " in *" $repo "*) ;; *) repos+=( "$repo" ) ;; esac
          done <<< "$TAGS"
          [ "${#repos[@]}" -gt 0 ] || { echo "::error::No repository to sign"; exit 1; }
          for repo in "${repos[@]}"; do
            echo "Signing ${repo}@${DIGEST}"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${repo}@${DIGEST}"
            cosign verify --key cosign.pub "${repo}@${DIGEST}" > /dev/null
          done
