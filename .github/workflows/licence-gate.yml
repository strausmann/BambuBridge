name: Licence gate

# Judges the dependencies a pull request changes against licence-policy.yml. No `paths:` filter on
# purpose: a required check that is skipped for a docs-only pull request would never report.
# The dependency graph API needs a public repository (or Advanced Security), so the job runs once
# the repository is public.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review the licences of changed dependencies
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./licence-policy.yml

      # The action only informs about dependencies whose licence it cannot detect and does not
      # fail. A gate that lets those through is open for exactly the packages nobody has looked at.
      # GitHub Actions are excluded: the graph never knows their licence and they are not shipped.
      - name: Refuse dependencies whose licence could not be detected
        if: ${{ always() && steps.review.outputs.invalid-license-changes != '' }}
        env:
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          unlicensed=$(printf '%s' "$INVALID_LICENSE_CHANGES" \
            | jq -r '.unlicensed[]? | select(.ecosystem != "actions") | "- \(.manifest) » \(.name)@\(.version)"')
          if [ -n "$unlicensed" ]; then
            echo "::error::Dependencies without a detectable licence. Read their licence file and add an exception to licence-policy.yml."
            printf '%s\n' "$unlicensed"
            exit 1
          fi
