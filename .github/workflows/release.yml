name: Release

on:
  schedule:
    - cron: '0 2 * * 0' # weekly, Sunday 02:00 UTC — the only scheduled release; no releases on push
  workflow_dispatch: # manual release any time


permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Disable husky git hooks in CI: semantic-release's git plugin makes the
    # `chore(release): …` commit, and the husky commit-msg hook would otherwise
    # run commitlint on that bot commit and reject it (long changelog body lines).
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm install
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
