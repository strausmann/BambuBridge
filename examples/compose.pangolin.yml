# ============================================================================
# BambuBridge - behind Pangolin
# The app joins the Pangolin network and is the Pangolin target. The resource is protected by
# Pangolin SSO. The trust token that proves the SSO header comes from your proxy is set in the
# BambuBridge settings (Settings > Sign-in) and injected here as a request header; it is not a
# start variable.
# Required in the .env file: POSTGRES_PASSWORD, BAMBUBRIDGE_SECRET_KEY, BAMBUBRIDGE_PUBLIC_URL,
# PUBLIC_HOST (the public host name), PROXY_IP (the fixed address of the Newt container),
# SSO_TRUST_TOKEN (the same value as in the settings).
# ============================================================================

services:
  bambubridge:
    image: ghcr.io/strausmann/bambubridge:${IMAGE_VERSION:-0.2.0}
    pull_policy: missing
    container_name: bambubridge
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # Postgres 18 is the only supported database. The password is the same as POSTGRES_PASSWORD below.
      BAMBUBRIDGE_DATABASE_URL: "postgresql+asyncpg://bambubridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/bambubridge"
      # 32 random bytes, base64url. Generate with: openssl rand -base64 32 | tr '+/' '-_'
      # Losing this key makes the stored secrets unreadable: keep a copy outside this host.
      BAMBUBRIDGE_SECRET_KEY: "${BAMBUBRIDGE_SECRET_KEY:?set BAMBUBRIDGE_SECRET_KEY}"
      BAMBUBRIDGE_PUBLIC_URL: "${BAMBUBRIDGE_PUBLIC_URL:?set BAMBUBRIDGE_PUBLIC_URL}"
      # One-time key (32+ characters) for the first sign-in. Remove it once an admin exists.
      BAMBUBRIDGE_BOOTSTRAP_ADMIN_KEY: "${BAMBUBRIDGE_BOOTSTRAP_ADMIN_KEY:-}"
      FORWARDED_ALLOW_IPS: "${PROXY_IP:?set PROXY_IP to the fixed address of your reverse proxy on this network}"
    networks:
      - pangolin_mgmt
      - internal
    expose:
      - "8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "pangolin.public-resources.bambubridge.name=BambuBridge"
      - "pangolin.public-resources.bambubridge.full-domain=${PUBLIC_HOST:?set PUBLIC_HOST}"
      - "pangolin.public-resources.bambubridge.protocol=http"
      - "pangolin.public-resources.bambubridge.ssl=true"
      - "pangolin.public-resources.bambubridge.targets[0].method=http"
      - "pangolin.public-resources.bambubridge.targets[0].port=8000"
      - "pangolin.public-resources.bambubridge.targets[0].path-match=prefix"
      - "pangolin.public-resources.bambubridge.targets[0].healthcheck.enabled=true"
      - "pangolin.public-resources.bambubridge.targets[0].healthcheck.hostname=bambubridge"
      - "pangolin.public-resources.bambubridge.targets[0].healthcheck.path=/healthz"
      - "pangolin.public-resources.bambubridge.targets[0].healthcheck.port=8000"
      - "pangolin.public-resources.bambubridge.auth.sso-enabled=true"
      - "pangolin.public-resources.bambubridge.request-headers[0].name=X-Pangolin-Token"
      - "pangolin.public-resources.bambubridge.request-headers[0].value=${SSO_TRUST_TOKEN:?set SSO_TRUST_TOKEN}"

  postgres:
    image: postgres:18.6-trixie
    pull_policy: missing
    container_name: bambubridge-postgres
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: bambubridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bambubridge
    volumes:
      - /docker/stacks/bambubridge/postgres/data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambubridge -d bambubridge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  pangolin_mgmt:
    name: pangolin_pangolin_mgmt
    external: true
  internal:
    internal: true
