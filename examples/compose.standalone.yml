# ============================================================================
# BambuBridge - standalone (no reverse proxy)
# Two containers: the app (API and web UI in one process) and Postgres 18.
# Use only on a trusted LAN. The data lives under /docker/stacks/bambubridge/.
# Create the directory first and give Postgres its owner:
#   mkdir -p /docker/stacks/bambubridge/postgres/data
# Required in the .env file next to this file: POSTGRES_PASSWORD, BAMBUBRIDGE_SECRET_KEY,
# BAMBUBRIDGE_PUBLIC_URL (for example http://bambubridge.example.invalid:8000).
# ============================================================================

services:
  bambubridge:
    image: ghcr.io/strausmann/bambubridge:${IMAGE_VERSION:-0.2.0}
    pull_policy: missing
    container_name: bambubridge
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # Postgres 18 is the only supported database. The password is the same as POSTGRES_PASSWORD below.
      BAMBUBRIDGE_DATABASE_URL: "postgresql+asyncpg://bambubridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/bambubridge"
      # 32 random bytes, base64url. Generate with: openssl rand -base64 32 | tr '+/' '-_'
      # Losing this key makes the stored secrets unreadable: keep a copy outside this host.
      BAMBUBRIDGE_SECRET_KEY: "${BAMBUBRIDGE_SECRET_KEY:?set BAMBUBRIDGE_SECRET_KEY}"
      BAMBUBRIDGE_PUBLIC_URL: "${BAMBUBRIDGE_PUBLIC_URL:?set BAMBUBRIDGE_PUBLIC_URL}"
      # One-time key (32+ characters) for the first sign-in. Remove it once an admin exists.
      BAMBUBRIDGE_BOOTSTRAP_ADMIN_KEY: "${BAMBUBRIDGE_BOOTSTRAP_ADMIN_KEY:-}"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro

  postgres:
    image: postgres:18.6-trixie
    pull_policy: missing
    container_name: bambubridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bambubridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bambubridge
    volumes:
      - /docker/stacks/bambubridge/postgres/data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambubridge -d bambubridge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
